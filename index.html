<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <h1>Calculator</h1>
        <div class="container">
            <input type="text" class="result" id="result" placeholder="0" />
			<div class="calculator-btn">
                <button class="percent" id="percent" value="%">%</button>
				<button class="clear" id="clear-entry" value=" ">CE</button> 
				<button class="clear" id="clear" value=" ">C</button>
				<button class="dltLast" id="dlt-last" value="⌫">⌫</button>
				<button class="divide" id="divide-by" value="1/x">1/x</button>  
				<button class="sq" id="sq" value="x²">x²</button> 
				<button class="sqrt" id="sqrt" value="√x">√x</button>
				<button class="operator" value=" + ">+</button>
                <button class="number" value="7">7</button>
                <button class="number" value="8">8</button>
                <button class="number" value="9">9</button>
                <button class="operator" value=" - ">-</button>
                <button class="number" value="4">4</button>
                <button class="number" value="5">5</button>
                <button class="number" value="6">6</button>
                <button class="operator" value=" * ">x</button>
                <button class="number" value="1">1</button>
                <button class="number" value="2">2</button>
                <button class="number" value="3">3</button>
                <button class="operator" value=" / ">÷</button>
                <button class="number" value="0">0</button>
                <button class="number" value=".">.</button> 
                <button class="number" value="00">00</button>
                <button class="equal" value="=">=</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
